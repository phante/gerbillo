# Vocabolario controllato del Livello di arricchimento (#1, ADR 0013).
# gerbillo importa -vocabolario rifiuta le categories di mappature.yaml che non sono qui, e il Backend
# quelle delle Foto (#52). Si modifica solo qui, con un commit. I valori sono della gallery:
# dove il sito ha un valore equivalente si usa quello, ma la gallery non lo aspetta.
categories:
    - documenti
    - eventi/fiera
    - eventi/presentazione
    - eventi/visita
    - off-topic
    - off-topic/divertenti
    - off-topic/ritocchi
    - opere-idrauliche/acquedotto
    - opere-idrauliche/canale
    - opere-idrauliche/condotta
    - opere-idrauliche/idrovora
    - opere-idrauliche/opifici
    - opere-idrauliche/presa
    - opere-idrauliche/traversa
    - tecnica/elettrica
    - tecnica/idraulica
    - tecnica/meccanica
    - tecnica/turbine/francis
    - tecnica/turbine/kaplan
    - tecnica/turbine/pelton
# Segnali di lavoro editoriale: il build non li mostra mai e allo Switch non devono restare Foto che li hanno.
# La descrizione è l'aiuto che il Backend mostra accanto al tag (#52).
tags_interni:
    - nome: da-classificare
      descrizione: manca la classificazione
    - nome: da-collegare
      descrizione: manca lo Slug
    - nome: da-separare
      descrizione: "l'album copre più pagine: le Foto vanno divise"
