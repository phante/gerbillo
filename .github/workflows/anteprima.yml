# Builda l'immagine dell'anteprima dev e la pubblica su ghcr (ADR 0011).
# Il server la scarica da solo: questo workflow non tocca mai il server.
# In parallelo il job test lancia i test Go e quelli end-to-end (ADR 0017): se fallisce
# avvisa su Telegram, ma non blocca l'anteprima.
name: anteprima
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  immagine:
    runs-on: ubuntu-latest
    # Solo questo job scrive il tag :dev, che il server di produzione esegue da solo.
    permissions:
      contents: read
      packages: write
    # Gruppo unico: un solo tag :dev, vince l'ultimo push di qualunque branch.
    concurrency:
      group: anteprima
      cancel-in-progress: true
    # MySQL con i dati di test, per generare la Gallery pubblica dell'anteprima (#12).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gallery
        run: |
          gunzip -c testdata/coppermine.sql.gz | mysql -h 127.0.0.1 -u root
          mysql -h 127.0.0.1 -u root -e "CREATE USER 'gerbillo_ro'@'%' IDENTIFIED BY 'gerbillo';
            GRANT SELECT ON progettodighe_it_gallery.* TO 'gerbillo_ro'@'%';
            GRANT SELECT ON progettodighe_it_forum.* TO 'gerbillo_ro'@'%';"
          scripts/anteprima-gallery.sh 127.0.0.1:3306 "${{ github.ref_name }} @ $(echo ${{ github.sha }} | cut -c1-7)"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: . # la cartella di lavoro, per includere dist/ generata qui sopra
          push: true
          tags: ghcr.io/phante/gerbillo:dev
          build-args: |
            BRANCH=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
      # Solo sui fallimenti: a build riuscita avvisa già il container dell'anteprima,
      # che ripartendo con l'immagine nuova manda la password con branch e commit.
      - name: notifica
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] || exit 0
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id=21449581 --data-urlencode text="$(printf 'gerbillo — build dev fallita ❌\nBranch: %s\nCommit: %.7s\n%s' "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
  test:
    runs-on: ubuntu-latest
    # Lancia npm ci e playwright install: niente permessi di scrittura.
    permissions:
      contents: read
    # Un gruppo per branch: un push su main non annulla i check di una PR.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: go test
        working-directory: backend
        run: go test ./...
      - name: test del bridge phpBB
        run: php ext/gerbillo/bridge/tests/utente_test.php
      # Gli stessi dati dell'anteprima, in dist/ e seme/, per il Backend dei test.
      - name: gallery
        run: |
          gunzip -c testdata/coppermine.sql.gz | mysql -h 127.0.0.1 -u root
          mysql -h 127.0.0.1 -u root -e "CREATE USER 'gerbillo_ro'@'%' IDENTIFIED BY 'gerbillo';
            GRANT SELECT ON progettodighe_it_gallery.* TO 'gerbillo_ro'@'%';
            GRANT SELECT ON progettodighe_it_forum.* TO 'gerbillo_ro'@'%';"
          scripts/anteprima-gallery.sh 127.0.0.1:3306 "test"
      - name: playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 14
      - name: notifica
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] || exit 0
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id=21449581 --data-urlencode text="$(printf 'gerbillo — test falliti ❌ (anteprima non bloccata)\nBranch: %s\nCommit: %.7s\n%s' "${{ github.ref_name }}" "${{ github.sha }}" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
