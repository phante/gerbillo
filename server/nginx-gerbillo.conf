# Da includere nel server block 443 di dev.progettodighe.it (ADR 0011).
# Niente add_header qui: in nginx annullerebbe quelli del server block
# (header_standard.conf e X-Robots-Tag noindex), che valgono anche per /gerbillo/.
# ^~: senza, le location a regex del vhost (es. per .css e .svg) vincono su questa
# e rispondono 404 ai file statici della Gallery.
location ^~ /gerbillo/ {
    proxy_pass http://127.0.0.1:8090/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 30m;
}
