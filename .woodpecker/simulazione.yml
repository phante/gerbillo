# Pipeline di simulazione: prova webhook e clone. Senza notifica Telegram (23/10/2026):
# la build di Woodpecker è solo predisposta e il messaggio a ogni push su main era rumore.
# Non builda e non pubblica nulla: la build sta su GitHub Actions (ADR 0011),
# perché il server di produzione ha 1,9 GiB di RAM.
when:
  - event: push
    branch: main
  - event: manual

steps:
  - name: info
    image: golang:1.27-alpine
    commands:
      - echo "branch $CI_COMMIT_BRANCH commit $CI_COMMIT_SHA"
      - go version
